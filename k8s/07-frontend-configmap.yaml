apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: mmproject
data:
  nginx.conf: |
    server {
        listen 80;
        client_max_body_size 10M;

        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/index.html $uri/ /index.html;
        }
    }
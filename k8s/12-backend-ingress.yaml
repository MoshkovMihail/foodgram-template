apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: mmproject
  annotations:
    # Эта аннотация говорит cert-manager'у выпустить сертификат
    cert-manager.io/cluster-issuer: "selfsigned-issuer" 
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.foodgram.k8s.local
      secretName: backend-tls
  rules:
    - host: api.foodgram.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
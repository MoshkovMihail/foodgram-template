apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodgram-frontend
  namespace: mmproject
  labels:
    app: foodgram-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodgram-frontend
  template:
    metadata:
      labels:
        app: foodgram-frontend
    spec:
      containers:
        - name: frontend
          image: foodgram-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mmproject
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Миграции БД
        - name: migrate
          image: foodgram-backend:latest
          imagePullPolicy: Never
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom: &env-from
            - configMapRef:
                name: foodgram-config
            - secretRef:
                name: foodgram-secret
        # Воркер для медиа (скрипт)
        - name: init-media
          image: foodgram-backend:latest
          imagePullPolicy: Never
          command: 
            - "/bin/sh"
            - "-c"
            - "mkdir -p /app/collected_media && chmod -R 777 /app/collected_media && echo 'Media worker script done'"
          volumeMounts:
            - name: media
              mountPath: /app/collected_media
        # Сборка статики в отдельную папку
        - name: collect-static
          image: foodgram-backend:latest
          imagePullPolicy: Never
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          envFrom: *env-from
          volumeMounts:
            - name: static
              mountPath: /app/collected_static
      containers:
        - name: backend
          image: foodgram-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom: *env-from
          volumeMounts:
            - name: media
              mountPath: /app/collected_media
            - name: static
              mountPath: /app/collected_static
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: backend-media
        - name: static
          persistentVolumeClaim:
            claimName: backend-static
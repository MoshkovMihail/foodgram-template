apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-user
  namespace: mmproject

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-user-binding
  namespace: mmproject
subjects:
- kind: ServiceAccount
  name: headlamp-user
  namespace: mmproject
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-namespace-lister
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-user-namespace-binding
subjects:
- kind: ServiceAccount
  name: headlamp-user
  namespace: mmproject
roleRef:
  kind: ClusterRole
  name: headlamp-namespace-lister
  apiGroup: rbac.authorization.k8s.io
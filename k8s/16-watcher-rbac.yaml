apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-watcher-sa
  namespace: mmproject

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: mmproject
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-watcher-rolebinding
  namespace: mmproject
subjects:
- kind: ServiceAccount
  name: pod-watcher-sa
  namespace: mmproject
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-watcher
  namespace: mmproject
  labels:
    app: pod-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-watcher
  template:
    metadata:
      labels:
        app: pod-watcher
    spec:
      serviceAccountName: pod-watcher-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: watcher
          image: pod-watcher:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: ntfy
                  key: topic
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
version: '3'

volumes:
  pg_data:
  static:
  media:
  frontend_build:

networks:
  foodgram_network:
    driver: bridge

services:
  db:
    image: postgres:14
    env_file: ../.env
    ports:
      - "5450:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - foodgram_network

  backend:
    container_name: foodgram-back
    build: ../backend/
    env_file: ../.env
    volumes:
      - static:/app/collected_static/
      - media:/app/collected_media/
    depends_on:
      - db
    networks:
      - foodgram_network

  frontend:
    container_name: foodgram-front
    build: ../frontend
    volumes:
      - frontend_build:/app/result_build/
    networks:
      - foodgram_network

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static:/staticfiles/
      - media:/mediafiles/
    depends_on:
      - backend
      - frontend
    networks:
      - foodgram_network

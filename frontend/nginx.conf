server {
    listen 80;
    client_max_body_size 10M;

    # --- Проксирование на Django ---
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend-service:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend-service:8000/admin/;
    }

    # короткие ссылки на рецепты /s/<id>/
    location ~ ^/s/[^/]+/?$ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend-service:8000$request_uri;
    }

    location /media/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend-service:8000/media/;
    }

    location /static/admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend-service:8000/static/admin/;
    }

    location /static/rest_framework/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend-service:8000/static/rest_framework/;
    }

    # --- Локальные штуки фронта ---

    # redoc.html лежит в корне build/ (CRA кладёт public/ → build/)
    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }

    # ассеты React: build/static/... → /static/...
    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # SPA-роутинг: любые несуществующие пути → index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}